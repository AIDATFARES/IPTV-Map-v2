<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="brandLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="60%" stop-color="#00C885" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="mapBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#00C885" />
    </linearGradient>
    <linearGradient id="logoPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Small Television Brand Icon -->
  <g transform="translate(6, 2) scale(0.74)">
    <!-- Antenna Left -->
    <line x1="38" y1="26" x2="24" y2="10" stroke="url(#brandLogoGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="24" cy="10" r="3" fill="#00E599" filter="url(#logoGlow)" />

    <!-- Antenna Right -->
    <line x1="62" y1="26" x2="76" y2="10" stroke="url(#brandLogoGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="76" cy="10" r="3" fill="#00E599" filter="url(#logoGlow)" />

    <!-- TV Stand Legs -->
    <line x1="28" y1="78" x2="20" y2="90" stroke="url(#brandLogoGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="72" y1="78" x2="80" y2="90" stroke="url(#brandLogoGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- TV Outer Frame / Bezel -->
    <rect x="10" y="24" width="80" height="54" rx="14" fill="#0B1320" stroke="url(#brandLogoGrad)" stroke-width="3.5" />

    <!-- TV Inner Screen -->
    <rect x="17" y="30" width="66" height="42" rx="8" fill="#060B12" />

    <!-- Streaming Play Triangle -->
    <polygon points="45,41 45,61 63,51" fill="url(#logoPlayGrad)" filter="url(#logoGlow)" />

    <!-- Power Indicator -->
    <circle cx="83" cy="71" r="2" fill="#00E599" filter="url(#logoGlow)" />
  </g>

  <!-- Typography: IPTV -->
  <text x="88" y="50" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1.2" fill="#FFFFFF">
    IPTV
  </text>
  
  <!-- MAP Badge -->
  <rect x="190" y="22" width="76" height="34" rx="8" fill="url(#mapBadgeGrad)" />
  <text x="228" y="46" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" fill="#060B12" text-anchor="middle">
    MAP
  </text>
  
  <!-- Subtitle Tag -->
  <text x="90" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="3.2" fill="#94A3B8">
    WORLDWIDE 4K NETWORK
  </text>
</svg>
