<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Brand Gradient: Electric Emerald to Cyber Blue -->
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="50%" stop-color="#00C885" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="tvPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="tvEmeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna Left with Glowing Tip -->
  <line x1="38" y1="26" x2="24" y2="10" stroke="url(#tvGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="24" cy="10" r="3" fill="#00E599" filter="url(#tvEmeraldGlow)" />

  <!-- Antenna Right with Glowing Tip -->
  <line x1="62" y1="26" x2="76" y2="10" stroke="url(#tvGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="76" cy="10" r="3" fill="#00E599" filter="url(#tvEmeraldGlow)" />

  <!-- TV Stand / Legs -->
  <line x1="28" y1="78" x2="20" y2="90" stroke="url(#tvGrad)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="72" y1="78" x2="80" y2="90" stroke="url(#tvGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- TV Outer Frame / Bezel -->
  <rect x="10" y="24" width="80" height="54" rx="14" fill="#0B1320" stroke="url(#tvGrad)" stroke-width="3.5" />

  <!-- TV Inner Display Screen -->
  <rect x="17" y="30" width="66" height="42" rx="8" fill="#060B12" />

  <!-- Screen subtle scanline / glass reflection highlight -->
  <path d="M18 31 L81 31 C82 31 82.5 32 82.5 33 L68 52 L17.5 52 L17.5 32 C17.5 31.5 17.8 31 18 31 Z" fill="white" opacity="0.04" />

  <!-- Centered Streaming Play Triangle -->
  <polygon points="45,41 45,61 63,51" fill="url(#tvPlayGrad)" filter="url(#tvEmeraldGlow)" />

  <!-- Power Status LED Indicator -->
  <circle cx="83" cy="71" r="2" fill="#00E599" filter="url(#tvEmeraldGlow)" />
</svg>
