<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="ogBgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#121E36" />
      <stop offset="60%" stop-color="#0B1320" />
      <stop offset="100%" stop-color="#060B12" />
    </radialGradient>
    <linearGradient id="ogBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="60%" stop-color="#00C885" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="ogTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBgGlow)" />
  
  <!-- Map Coordinate Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glowing Radar Auras -->
  <circle cx="600" cy="200" r="260" fill="#00E599" opacity="0.14" filter="url(#ogGlow)" />
  <circle cx="780" cy="260" r="220" fill="#3B82F6" opacity="0.12" filter="url(#ogGlow)" />

  <!-- Small Television Logo Mark in Center -->
  <g transform="translate(535, 75) scale(1.35)">
    <!-- Antenna Left -->
    <line x1="38" y1="26" x2="24" y2="10" stroke="url(#ogBrandGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="24" cy="10" r="3" fill="#00E599" filter="url(#ogGlow)" />

    <!-- Antenna Right -->
    <line x1="62" y1="26" x2="76" y2="10" stroke="url(#ogBrandGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="76" cy="10" r="3" fill="#00E599" filter="url(#ogGlow)" />

    <!-- TV Stand Legs -->
    <line x1="28" y1="78" x2="20" y2="90" stroke="url(#ogBrandGrad)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="72" y1="78" x2="80" y2="90" stroke="url(#ogBrandGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- TV Outer Frame -->
    <rect x="10" y="24" width="80" height="54" rx="14" fill="#0B1320" stroke="url(#ogBrandGrad)" stroke-width="3.5" />

    <!-- TV Inner Screen -->
    <rect x="17" y="30" width="66" height="42" rx="8" fill="#060B12" />

    <!-- Play Triangle -->
    <polygon points="45,41 45,61 63,51" fill="url(#ogBrandGrad)" filter="url(#ogGlow)" />

    <!-- Power Indicator -->
    <circle cx="83" cy="71" r="2" fill="#00E599" filter="url(#ogGlow)" />
  </g>

  <!-- Brand Title -->
  <text x="600" y="295" font-family="'Outfit', 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    IPTV <tspan fill="#00E599">MAP</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="355" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="url(#ogTextGrad)" text-anchor="middle">
    Worldwide 4K Ultra HD Streaming &amp; Precision Channel Navigation
  </text>

  <!-- Key Feature Badges -->
  <g transform="translate(205, 415)">
    <rect x="0" y="0" width="240" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,153,0.35)" />
    <text x="120" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#00E599" text-anchor="middle">⚡ 50,000+ 4K Channels</text>

    <rect x="270" y="0" width="240" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,153,0.35)" />
    <text x="390" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#00E599" text-anchor="middle">🛡️ Anti-Freeze 99.9% Uptime</text>

    <rect x="540" y="0" width="250" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,153,0.35)" />
    <text x="665" y="30" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#00E599" text-anchor="middle">📱 Universal Device Sync</text>
  </g>

  <!-- Domain and WhatsApp Footer -->
  <text x="600" y="545" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">
    www.iptvmap.it.com • 24/7 Dedicated Support &amp; Instant Activation
  </text>
</svg>
